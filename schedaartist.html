<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partenope - Festival art</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <!-- header -->
    <header>
        <nav>
            <div class="d-flex justify-content-between">
                <div class="logo d-flex align-items-center justify-content-center"
                    onclick="window.location.href='index.html'">
                    <img src="img/logo-desk.svg" alt="Partenope Festival">
                </div>
                <div id="voci" class="bg-body">
                    <ul class="list-unstyled d-flex m-0">
                        <li><a href="about.html">about</a></li>
                        <li><a href="events.html">events</a></li>
                        <li><a href="artists.html">artists</a></li>
                        <li><a href="contact.html">contact</a></li>
                        <li><a href="">cart</a></li>
                        <li><a href="">profile</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- hero -->
        <section id="heroSchedaEvento">
            <div class="d-flex align-items-center gap-3">
                <div><img src="img/back_arrow.svg" alt="Back" onclick="history.back()" style="cursor: pointer;"></div>
                <div>
                    <h1 id="nomeArtista"></h1>
                </div>
            </div>
        </section>

        <!-- scheda artista -->
        <section id="schedaArtist">
            <div class="d-flex">
                <div class="bordoSinistraScheda"></div>
                <div class="d-flex flex-column w-100">
                    <div class="contFiltri">
                        <div class="filtri d-flex">
                            <div class="d-flex">
                                <span class="titoloFiltro">Category:</span>
                                <span id="cat"></span>
                            </div>
                        </div>
                    </div>
                    <div class="divisore bordoSopra"></div>
                    <div class="d-flex">
                        <div class="contImgArtist">
                            <img src="" alt="" class="w-100" id="imgArtista">
                        </div>
                        <div class="contInfoArtist">
                            <div class="d-flex">
                                <button type="button" class="w-100 btnBiography" id="btnBiography">Biography</button>
                                <button type="button" class="btnPortfolio w-100" id="btnPortfolio">Portfolio</button>
                            </div>
                            <div class="contP d-flex align-items-center justify-content-center">
                                <p id="biografiaArtista"></p>
                            </div>
                        </div>
                    </div>
                    <div class="seeAlso">
                        <p>See also</p>
                    </div>
                    <div id="seeAlsoArtist">
                        <!-- inserimento card-->
                    </div>
                </div>
                <div class="bordoDestraScheda"></div>
            </div>
        </section>

        <section id="sei">
            <form action="" class="d-flex align-items-end justify-content-between">
                <div class="d-flex flex-column w-100">
                    <p>Receive updates on new events, exhibitions <br>and calls for proposals by subscribing to our
                        newsletter.</p>
                    <input type="email" placeholder="Email">
                    <button type="submit" class="d-flex align-items-center justify-content-between">Subscribe <img
                            src="img/arrow.svg" alt=""></button>
                </div>
                <div class="d-flex flex-column w-100">
                    <p>Do you have an artistic project to showcase? <br>Apply for the next edition of the festival.</p>
                    <button type="button" class="d-flex align-items-center justify-content-between">Form <img
                            src="img/arrow.svg" alt=""></button>
                </div>
            </form>
        </section>
        <div class="divisore"></div>
    </main>

    <footer></footer>

    <!-- js -->
    <script src="index.js"></script>
    <script src="schedaartist.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
